# LUXCAL run config — variant: full
#
# The complete pipeline with every node enabled. Ablation variants
# (minus_critic, minus_calibration, ...) copy this file and change what they
# need; the variant name itself is passed to RunLogger, not read from here.
#
# Paths are relative to the process working directory (the repository root).
#
# Model strings are pinned exactly as the API publishes them. Current Claude
# model IDs carry no date suffix — `claude-sonnet-4-6` is the complete,
# non-floating identifier, and appending a date makes it invalid. What SPEC
# §7.5 is guarding against is a drifting alias, not the absence of a date.

model_generation: claude-sonnet-4-6
model_judge: claude-opus-4-6

# The ablation condition. This is what build_graph and Agent 2 branch on;
# run_single's --variant flag only labels the run in the manifest.
variant: full

rubric_path: luxcal/rubric/rubric_v1.yaml

# Cap on the ideation-critic loop. Justified by the oversmoothing literature:
# additional rounds yield diminishing and eventually negative returns. Varied
# across {1, 3, 5} as an ablation condition.
critic_max_iterations: 3
