# LUXCAL calibration rubric — version v1
#
# Frozen for the duration of the experiment (SPEC §3). Any change to a
# vocabulary, ordinal map or threshold invalidates prior runs and requires a
# version increment. This file is snapshotted into every run directory and
# hashed into the run manifest (rubric_version, rubric_sha256).
#
# `definition`, `diagnostic_questions` and `grounding.reference` are
# transcribed verbatim from rubric/dimensions/source.md and are injected
# unmodified into the Agent 1 extraction prompt. Do not paraphrase them here
# or at call time.

version: v1
description: >-
  Calibration standard for the five-dimension luxury brand profile: closed
  position vocabularies, the diagnostic material injected verbatim into the
  Brand Profiler prompt, and the ordinal maps and band thresholds used by the
  deterministic ceiling arithmetic.

# ---------------------------------------------------------------------------
# Dimensions
#
# `name` follows the controlled vocabulary of SPEC §3.1. `profile_field` is
# the BrandProfile attribute this dimension populates.
# ---------------------------------------------------------------------------

dimensions:
  - id: d1
    name: "Rarity & Scarcity Posture"
    profile_field: d1_rarity
    positions:
      - OBJECTIVE
      - VIRTUAL
      - DIFFUSE
    definition: |-
      This dimension evaluates the brand's management of product availability, distinguishing between "objective rarity" (physical scarcity of ingredients and production) and "abundant rarity" (virtual rarity through limited editions and capsule collections). In luxury growth strategies, AI must calibrate its interactions to maintain feelings of privilege even when physical rarity is abandoned for scale.
    diagnostic_questions:
      - 'Does the brand brief rely on actual physical scarcity or "virtual rarity" tactics to fuel consumer desire?.'
      - 'Is the distribution strategy strictly "selective" (few stores/limited access) or moving toward "high diffusion" which risks brand dilution?.'
      - 'Does the scenario require the AI to enforce "inaccessibility" signals (e.g., waitlists) to reinforce the brand''s elitism?.'
    grounding:
      reference: |-
        "Beyond rarity: the paths of luxury desire" (Kapferer and Valette-Florence, 2016); Sections 333 (Selective Distribution) and 351 (Selection Path).
      source_file: dimensions/source.md
    retrieval_confidence:
      score: High
      justification: |-
        Extensive textual evidence exists detailing the transition from objective to virtual rarity and its role in luxury brand building.

  - id: d2
    name: "Scenic Invisibility Requirement"
    profile_field: d2_invisibility
    positions:
      - STRICT
      - MODERATE
      - RELAXED
    definition: |-
      This dimension assesses the requirement for AI to integrate "invisibly" as a backstage "symbolic infrastructure" that reinforces narrative and ritual without intruding upon the "human touch". The legitimacy of luxury AI hinges on its "scenic discretion," ensuring that the consumer experience remains a "dramaturgical event" centered on human performance.
    diagnostic_questions:
      - 'Is the AI designed as a "backstage operator" to orchestrate atmospheres rather than taking center stage as a visible protagonist?.'
      - 'Does the implementation avoid "overacted" or conspicuous technology that might undermine the "emotional pact" with the client?.'
      - 'Does the brief require the AI to function as a "relational infrastructure" that enhances, rather than replaces, the performative gestures of the sales advisor?.'
    grounding:
      reference: |-
        "Redefining consumer experience through artificial intelligence in the luxury retail sector" (Cenizo, 2025); Sections 502 (Technological Invisibility) and 528 (Dramaturgical Logic).
      source_file: dimensions/source.md
    retrieval_confidence:
      score: High
      justification: |-
        The concept of "scenic invisibility" and AI as "symbolic infrastructure" is a primary contribution of the Cenizo (2025) paper.

  - id: d3
    name: "Consumption Value Orientation"
    profile_field: d3_value_orientation
    positions:
      - EMOTIONAL_LED
      - BALANCED
      - FUNCTIONAL_LED
    definition: |-
      Grounded in Consumption Value Theory (CVT), this dimension identifies whether the brand brief prioritizes "functional value" (quality, performance, technical mastery) or "emotional value" (hedonic pleasure, prestige, status). AI integration often enhances functional perceptions but can diminish emotional brand essence if not calibrated.
    diagnostic_questions:
      - 'Does the brand rely more on "brand essence" (emotional/hedonic) or "functional utility" (utilitarian/practical) for its perceived value?.'
      - 'Is the AI being used to enhance "technical excellence" (e.g., quality verification) or is it expected to create a "deep connection" (emotional)?.'
      - 'Does the brief account for the "negative consumer response" that occurs when AI is seen to reduce a product''s perceived uniqueness or symbolic value?.'
    grounding:
      reference: |-
        "AI in luxury consumption: bridging consumer desires and managerial perspectives" (Eastman and Aboulnasr, 2026); Sections 142 (CVT) and 149 (AI-designed luxury effects).
      source_file: dimensions/source.md
    retrieval_confidence:
      score: High
      justification: |-
        Multiple studies in the corpus explicitly apply CVT to evaluate AI's dual role in functional and hedonic value delivery.

  - id: d4
    name: "Motivation Profile"
    profile_field: d4_motivation
    positions:
      - UNM
      - MIXED
      - ELT
    definition: |-
      This dimension evaluates the target consumer's motivation, distinguishing between "Unknown to the Masses" (UNM—desire for privacy/subtle luxury) and "Association with the Elite" (ELT—need for peer recognition and cultural capital). AI adaptability must shift based on whether consumers value AI's private utility or its capacity to signal elite status.
    diagnostic_questions:
      - 'Is the target consumer driven by "inconspicuous luxury motivations" that favor discreet, expert-only signals?.'
      - 'Does the brief prioritize "functional value" to satisfy UNM consumers who consume luxury in private?.'
      - 'Is "emotional resonance" emphasized to strengthen the link to "willingness to buy" for status-driven consumers (ELT)?.'
    grounding:
      reference: |-
        "AI in luxury consumption: bridging consumer desires and managerial perspectives" (Eastman and Aboulnasr, 2026); Sections 156 (UNM) and 157 (ELT).
      source_file: dimensions/source.md
    retrieval_confidence:
      score: High
      justification: |-
        The moderation effect of UNM and ELT motivations on AI willingness to buy is empirically validated within the text.

  - id: d5
    name: "Symbolic Orchestration Control"
    profile_field: d5_orchestration
    positions:
      - STRONG
      - PARTIAL
      - WEAK
    definition: |-
      This dimension evaluates the "curatorial role" of the brand in the MAS workflow, ensuring that algorithmic outputs are filtered through brand storytelling rather than mere statistical relevance. In luxury, "the algorithm does not have the final word"; it is a system of "curated pertinence".
    diagnostic_questions:
      - 'Is the AI''s "personalization" logic filtered through brand storytelling and cultural codes to ensure "narrative coherence"?.'
      - 'Does the brief define AI as a "symbolic mediator" whose suggestions must be "ritualized" by human actors?.'
      - 'Does the workflow include "curatorial filtering" to prevent automated suggestions from devolving into banality?.'
    grounding:
      reference: |-
        "Redefining consumer experience through artificial intelligence in the luxury retail sector" (Cenizo, 2025); Sections 509 (Curation) and 531 (Algorithmic Curation).
      source_file: dimensions/source.md
    retrieval_confidence:
      score: High
      justification: |-
        Detailed textual evidence supports the "curator" role and the separation of "relevance" from "pertinence" in luxury AI.

# ---------------------------------------------------------------------------
# Ceiling arithmetic (SPEC §5.2)
#
# Visibility is driven by D2 + D4; intensity by D1 + D3. D5 adjusts both.
# Declared here rather than hard-coded so the weighting can be varied as an
# ablation condition.
# ---------------------------------------------------------------------------

ceilings:
  visibility:
    contributing_dimensions: [d2, d4]
    adjusting_dimension: d5
  intensity:
    contributing_dimensions: [d1, d3]
    adjusting_dimension: d5

  ordinal_maps:
    d1:
      OBJECTIVE: 0
      VIRTUAL: 1
      DIFFUSE: 2
    d2:
      STRICT: 0
      MODERATE: 1
      RELAXED: 2
    d3:
      EMOTIONAL_LED: 0
      BALANCED: 1
      FUNCTIONAL_LED: 2
    d4:
      UNM: 0
      MIXED: 1
      ELT: 2

  adjustment_map:
    d5:
      STRONG: 1
      PARTIAL: 0
      WEAK: -1

# ---------------------------------------------------------------------------
# Band thresholds (SPEC §3.4, §5.2)
#
# Raw score is clamped to [clamp.min, clamp.max], then the first threshold
# whose max_score the clamped value does not exceed determines the band.
# Thresholds are evaluated in the order given and must be ascending.
# ---------------------------------------------------------------------------

bands:
  ordinal_order: [LOW, MEDIUM, HIGH]
  clamp:
    min: 0
    max: 5
  thresholds:
    - band: LOW
      max_score: 1
    - band: MEDIUM
      max_score: 3
    - band: HIGH
      max_score: 5
